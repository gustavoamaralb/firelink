[global]
   workgroup = WORKGROUP
   server string = firelink
   netbios name = FIRELINK
   server role = standalone server
   server min protocol = SMB2_10
   map to guest = never
   restrict anonymous = 2
   interfaces = lo enp3s0f2
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.15.0/24
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   # no printers
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # file names and attributes Windows expects
   vfs objects = acl_xattr catia streams_xattr
   map acl inherit = yes
   inherit acls = yes
   inherit permissions = yes
   unix charset = UTF-8

[bau]
   comment = Shared household files
   path = /srv/firelink/bau
   valid users = @bau
   force group = bau
   read only = no
   create mask = 0664
   directory mask = 2775

# One personal share per person (replace fulano/fulana with your household users).
# The admin can be added to "valid users" of the other personal shares.
[fulano]
   comment = Fulano's personal folder
   path = /srv/firelink/fulano
   valid users = fulano
   read only = no

[fulana]
   comment = Fulana's personal folder
   path = /srv/firelink/fulana
   valid users = fulana fulano
   force group = fulana
   read only = no
