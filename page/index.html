<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0806">
<title>Firelink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='3' y='1' width='2' height='1' fill='%23ffd36b'/><rect x='2' y='2' width='4' height='2' fill='%23ff9a2e'/><rect x='2' y='4' width='4' height='2' fill='%23ff5a1a'/><rect x='1' y='6' width='6' height='1' fill='%23704a2c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0806;
    --gold: #e0b45c;
    --gold-dark: #7a5a2a;
    --text: #efe2c6;
    --muted: #a89272;
    --ember: #ff8a2b;
    --panel: #15100b;
    --panel-hover: #24170d;
    --px: 4px; /* size of one border "pixel" */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse 55% 40% at 50% 100%, rgba(255,110,30,.12), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "VT323", ui-monospace, Consolas, monospace;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
    image-rendering: pixelated;
    font-variant-ligatures: none;
  }
  /* very subtle scanlines, old-screen style */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  canvas#brasas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; width: 100%; max-width: 460px; text-align: center; }

  .cena { display: flex; justify-content: center; align-items: flex-end; gap: 4px; width: max-content; margin: 0 auto; }
  .guardia { position: relative; width: 80px; height: 110px; margin-bottom: 2px; }
  .guardia::before {   /* candle light */
    content: ""; position: absolute; left: 50%; top: 65px; width: 90px; height: 90px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,170,70,.28), transparent 65%);
    animation: pulsar 1.8s steps(3) infinite;
  }
  canvas#guardia { position: relative; width: 80px; height: 110px; }
  .fogueira { position: relative; width: 168px; height: 176px; }

  .dialogo {
    position: relative; text-align: left;
    margin: 28px var(--px) 40px; padding: 18px 18px 14px;
    background: #0e0b08;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--text),
      0 var(--px) 0 0 var(--text),
      calc(-1 * var(--px)) 0 0 0 var(--text),
      var(--px) 0 0 0 var(--text),
      inset 0 0 0 var(--px) #2a2018;
    cursor: pointer; min-height: 92px;
  }
  .dialogo .nome {
    position: absolute; top: -14px; left: 14px; padding: 2px 8px;
    background: var(--bg); color: var(--gold);
    font-family: "Silkscreen", monospace; font-size: 12px; letter-spacing: .08em;
    box-shadow: 0 0 0 2px var(--gold-dark);
  }
  .dialogo p { margin: 0; font-size: 24px; line-height: 1.15; color: var(--text); min-height: 2.3em; }
  .dialogo .seta { position: absolute; right: 12px; bottom: 6px; color: var(--gold); font-size: 16px; opacity: 0; }
  .dialogo.fim .seta { opacity: 1; animation: piscar .8s steps(2) infinite; }
  .dialogo.escolhendo .seta { display: none; }
  .dialogo.escolhendo p { min-height: 0; }
  .opcoes { display: grid; gap: 2px; margin: 10px 0 2px 22px; }
  .opcoes button {
    position: relative; text-align: left; background: none; border: 0; padding: 2px 0;
    font-family: "Silkscreen", monospace; font-size: 18px; letter-spacing: .06em;
    color: var(--muted); cursor: pointer;
  }
  .opcoes button::before {
    content: "▶"; position: absolute; left: -22px; top: 50%; transform: translateY(-50%);
    color: var(--ember); font-family: "VT323", monospace; font-size: 20px; opacity: 0;
  }
  .opcoes button:hover, .opcoes button:focus-visible { color: var(--gold); outline: none; }
  .opcoes button:hover::before, .opcoes button:focus-visible::before { opacity: 1; animation: piscar .6s steps(2) infinite; }
  .trocar {
    position: absolute; left: 14px; bottom: -26px; background: none; border: 0; padding: 0;
    font-family: "VT323", monospace; font-size: 18px; color: var(--gold-dark); cursor: pointer;
  }
  .trocar:hover, .trocar:focus-visible { color: var(--gold); outline: none; text-decoration: underline; }
  .fogueira::before {
    content: ""; position: absolute; left: 50%; bottom: 6px; width: 260px; height: 200px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 80%, rgba(255,120,40,.22), transparent 65%);
    animation: pulsar 2.4s steps(4) infinite;
  }
  @keyframes pulsar { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  canvas#fogo { position: relative; width: 168px; height: 176px; }

  h1 {
    font-family: "Silkscreen", "VT323", monospace; font-weight: 700;
    font-size: clamp(32px, 10vw, 48px); letter-spacing: .08em;
    margin: 14px 0 4px; color: var(--gold);
    text-shadow: 4px 4px 0 #3a2410, 0 0 20px rgba(255,140,50,.25);
  }
  .divisor { display: flex; justify-content: center; gap: 6px; margin: 10px 0 8px; }
  .divisor i { display: block; width: 8px; height: 8px; background: var(--gold-dark); }
  .divisor i:nth-child(3) { background: var(--ember); }
  p.sub { margin: 0 0 30px; color: var(--muted); font-size: 24px; }

  nav { display: grid; gap: 22px; padding: 0 var(--px); }
  /* panel with pixelated borders (notched corners) */
  a.botao {
    position: relative; display: block;
    padding: 14px 18px 12px;
    background: var(--panel);
    color: var(--text); text-decoration: none;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--gold-dark),
      0 var(--px) 0 0 var(--gold-dark),
      calc(-1 * var(--px)) 0 0 0 var(--gold-dark),
      var(--px) 0 0 0 var(--gold-dark),
      0 calc(2 * var(--px)) 0 0 #000;
    transition: none;
  }
  a.botao:hover, a.botao:focus-visible {
    background: var(--panel-hover); outline: none;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--gold),
      0 var(--px) 0 0 var(--gold),
      calc(-1 * var(--px)) 0 0 0 var(--gold),
      var(--px) 0 0 0 var(--gold),
      0 calc(2 * var(--px)) 0 0 #000,
      0 0 24px 4px rgba(255,120,40,.18);
  }
  /* retro game menu arrow */
  a.botao::before {
    content: "▶"; position: absolute; left: -34px; top: 50%; transform: translateY(-50%);
    color: var(--ember); font-size: 22px; opacity: 0;
  }
  a.botao:hover::before, a.botao:focus-visible::before { opacity: 1; animation: piscar .6s steps(2) infinite; }
  @keyframes piscar { 50% { opacity: 0; } }
  .titulo {
    font-family: "Silkscreen", "VT323", monospace; font-weight: 400;
    font-size: 20px; letter-spacing: .06em; color: var(--gold);
  }
  .desc { color: var(--muted); font-size: 22px; line-height: 1.1; margin-top: 4px; }

  .disco { margin: 34px var(--px) 0; text-align: left; }
  .disco-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .disco-topo b { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--gold-dark); }
  .disco-topo span { font-size: 20px; color: var(--muted); }
  .barra {
    height: 18px; background: #0e0b08; position: relative;
    box-shadow: 0 -3px 0 0 var(--gold-dark), 0 3px 0 0 var(--gold-dark), -3px 0 0 0 var(--gold-dark), 3px 0 0 0 var(--gold-dark), 0 6px 0 0 #000;
  }
  .barra .usado {
    height: 100%; width: 0; min-width: 6px;
    background: repeating-linear-gradient(90deg, var(--cor, #f06818) 0 6px, var(--cor2, #d4420e) 6px 8px);
    box-shadow: inset 0 3px 0 rgba(255,220,150,.35);
    transition: width .8s steps(12);
  }
  .barra.alerta { --cor: #e0402a; --cor2: #a8241a; }
  .disco-legenda { display: flex; justify-content: space-between; margin-top: 10px; font-size: 19px; color: var(--muted); }
  .disco-legenda .q { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: 0; }
  .usado-q { background: #f06818; } .livre-q { background: #0e0b08; box-shadow: 0 0 0 2px var(--gold-dark); }

  /* --- status lights --- */
  .luz { display: inline-block; width: 8px; height: 8px; margin: 0 10px 2px 0; vertical-align: middle; background: #5a5046; box-shadow: 0 0 0 2px #000; }
  .luz.ok { background: #7fd45a; box-shadow: 0 0 0 2px #000, 0 0 8px rgba(127,212,90,.6); animation: pulsoluz 2.4s steps(2) infinite; }
  .luz.fora { background: #e0402a; box-shadow: 0 0 0 2px #000, 0 0 8px rgba(224,64,42,.6); }
  @keyframes pulsoluz { 50% { opacity: .55; } }
  /* --- server (uptime, disk health) --- */
  .servidor { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; font-size: 19px; color: var(--muted); }
  .servidor .ic { display: inline-block; width: 22px; text-align: center; margin-right: 8px; }
  .servidor .bom { color: #9fdc7c; } .servidor .ruim { color: #ff7a5c; }
  /* --- scoreboard --- */
  .placar { margin: 30px var(--px) 0; text-align: left; }
  .placar b { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--gold-dark); }
  .placar table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 20px; color: var(--muted); }
  .placar td { padding: 2px 0; }
  .placar td.n { width: 40%; color: var(--text); }
  .placar td.v { text-align: right; white-space: nowrap; }
  .placar tr.eu td.n { color: var(--gold); }
  .placar tr.eu td.n::before { content: "▶ "; color: var(--ember); }
  .placar svg { vertical-align: -1px; margin-right: 6px; }
  /* --- Christmas tree --- */
  .arvore { width: 84px; height: 144px; margin: 0 2px 2px 0; }
  .arvore canvas { width: 84px; height: 144px; display: block; }
  /* --- sky: starry night, brighter morning --- */
  .ceu { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .ceu i { position: absolute; width: 3px; height: 3px; background: #dfe8ff; opacity: .7; animation: piscaestrela 3s steps(2) infinite; }
  @keyframes piscaestrela { 50% { opacity: .15; } }
  body.noite { background: radial-gradient(ellipse 55% 40% at 50% 100%, rgba(255,110,30,.10), transparent 70%), #05060c; }
  body.madrugada { background: radial-gradient(ellipse 55% 40% at 50% 100%, rgba(255,110,30,.08), transparent 70%), #030409; }
  body.manha { background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,190,120,.10), transparent 70%), radial-gradient(ellipse 55% 40% at 50% 100%, rgba(255,110,30,.12), transparent 70%), #110d09; }
  .aviso-sim { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 4; background: #3a1a10; color: #ffd36b; font-family: "Silkscreen", monospace; font-size: 12px; letter-spacing: .06em; padding: 6px 12px; text-decoration: none; box-shadow: 0 0 0 2px #ff8a2b; white-space: nowrap; }
  .bolo { width: 60px; height: 64px; margin: 0 2px 2px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
  .bolo canvas { width: 60px; height: 64px; display: block; }
  .bolo::before { content: ""; position: absolute; left: 50%; top: 4px; width: 50px; height: 50px; transform: translate(-50%, -30%);
                  background: radial-gradient(circle, rgba(255,200,110,.30), transparent 65%); pointer-events: none; }
  .bolo.apagado::before { display: none; }
  .bolo:focus-visible { outline: 2px dashed var(--gold-dark); outline-offset: 4px; }
  canvas#baloes { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  canvas#confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  footer { margin-top: 34px; color: var(--muted); font-size: 21px; line-height: 1.35; }
  footer b { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 13px; color: var(--gold-dark); letter-spacing: .1em; }
  code { font-family: "VT323", monospace; font-size: 21px; color: var(--text); background: #1b140d; padding: 0 6px; }

  .arquivos { display: inline-grid; grid-template-columns: auto auto; align-items: center; justify-items: start; column-gap: 10px; row-gap: 8px; margin-top: 8px; }
  .os { display: block; width: 24px; height: 28px; justify-self: center; }
  .os svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }

  @media (max-width: 420px) { a.botao::before { left: -26px; } }
  .akali { position: relative; width: 136px; height: 88px; padding: 0; margin: 0 0 2px; border: 0; background: none; cursor: pointer; }
  .akali canvas { width: 136px; height: 88px; display: block; }
  .akali.tremor { animation: tremor .35s steps(4); }
  @keyframes tremor { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-2px); } }
  .flutua.mel { color: #f4f1ea; font-family: "VT323", monospace; font-size: 20px; white-space: nowrap; text-shadow: 2px 2px 0 #2a1d14; animation-duration: 2.6s; }
  .akali.ronrona canvas { animation: vibra .09s steps(2) infinite; }
  @keyframes vibra { 0% { transform: translate(0, 0); } 50% { transform: translate(1px, 0); } }
  .flutua.rr { color: #d9ccb4; font-family: "VT323", monospace; font-size: 18px; white-space: nowrap; text-shadow: 2px 2px 0 #2a1d14; animation-duration: 2.8s; }
  .flutua.chamado { color: #fff1b8; font-family: "Silkscreen", monospace; font-size: 13px; white-space: nowrap; text-shadow: 2px 2px 0 #3a2410, 0 0 10px rgba(255,200,120,.5); animation-duration: 3s; }
  .flutua.pa { color: #ffd36b; font-size: 14px; font-weight: 700; text-shadow: 2px 2px 0 #3a2410; }
  @media (max-width: 440px) {
    .akali, .akali canvas { width: 102px; height: 66px; }
    .fogueira, canvas#fogo { width: 126px; height: 132px; }
  }
  .akali:focus-visible { outline: 2px dashed var(--gold-dark); outline-offset: 4px; }
  .flutua { position: absolute; pointer-events: none; font-family: "Silkscreen", monospace; animation: subir 2.2s steps(11) forwards; }
  .flutua.z { color: #b9c7d6; font-size: 12px; }
  .flutua.coracao { width: 12px; height: 11px; }
  @keyframes subir { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx, 6px), -42px); opacity: 0; } }
  @media (max-width: 370px) { .guardia { transform: scale(.85); transform-origin: bottom center; } }
  @media (prefers-reduced-motion: reduce) {
    .fogueira::before, .guardia::before, a.botao:hover::before, .dialogo.fim .seta { animation: none; }
    .flutua { display: none; }
    .luz.ok, .ceu i { animation: none; }
    .akali.ronrona canvas { animation: none; }
    canvas#brasas { display: none; }
  }
</style>
</head>
<body>
<div class="ceu" id="ceu" aria-hidden="true"></div>
<canvas id="brasas" aria-hidden="true"></canvas>
<canvas id="confete" aria-hidden="true"></canvas>
<canvas id="baloes" aria-hidden="true" hidden></canvas>
<main>
  <div class="cena">
    <div class="arvore" id="arvore" aria-hidden="true" hidden><canvas id="pinheiro" width="21" height="36"></canvas></div>
    <div class="guardia" aria-hidden="true"><canvas id="guardia" width="16" height="22"></canvas></div>
    <div class="fogueira" aria-hidden="true"><canvas id="fogo" width="42" height="44"></canvas></div>
    <button class="bolo" id="bolo" type="button" aria-label="Apagar a velinha" hidden><canvas id="bolocv" width="15" height="16"></canvas></button>
    <button class="akali" id="akali" type="button" aria-label="Fazer carinho na Akali"><canvas id="gata" width="34" height="22"></canvas></button>
  </div>

  <h1>FIRELINK</h1>
  <div class="divisor" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="dialogo" id="dialogo" role="status" aria-live="polite">
    <span class="nome" id="quemfala">Guardiã da Chama</span>
    <p id="fala"></p>
    <div class="opcoes" id="opcoes" hidden></div>
    <button class="trocar" id="trocar" type="button" hidden>não é você?</button>
    <span class="seta" aria-hidden="true">▼</span>
  </div>

  <nav>
    <a class="botao" id="jellyfin" href="#">
      <div class="titulo"><i class="luz" id="luz-jellyfin" title="verificando..."></i>eCinema</div>
      <div class="desc">Filmes, animações, séries e aulas</div>
    </a>
    <a class="botao" id="kavita" href="#">
      <div class="titulo"><i class="luz" id="luz-kavita" title="verificando..."></i>eBiblioteca</div>
      <div class="desc">Quadrinhos, ficção e acadêmicos</div>
    </a>
  </nav>

  <section class="disco" id="disco" aria-label="Espaço em disco do servidor">
    <div class="disco-topo"><b>DISCO</b><span id="disco-txt">…</span></div>
    <div class="barra" role="meter" aria-valuemin="0" aria-valuemax="100" id="disco-barra"><div class="usado" id="disco-usado"></div></div>
    <div class="disco-legenda"><span><i class="q usado-q"></i>usado <span id="disco-u">…</span></span><span><i class="q livre-q"></i>livre <span id="disco-l">…</span></span></div>
    <ul class="servidor">
      <li id="srv-ligado"><span class="ic">🔥</span>…</li>
      <li id="srv-hd"><span class="ic">▣</span>…</li>
    </ul>
  </section>

  <section class="placar" id="placar" hidden aria-label="Placar da Akali">
    <b>PLACAR DA AKALI</b>
    <table><tbody id="placar-linhas"></tbody></table>
  </section>

  <footer>
    <b>ARQUIVOS</b><br>
    <div class="arquivos">
      <span class="os" data-sprite="win" title="Windows"></span><code>\\firelink</code>
      <span class="os" data-sprite="tux" title="Linux"></span><code>smb://firelink.local</code>
    </div>
  </footer>
</main>
<script src="config.js"></script>
<script>
  // links reuse the address that was typed (firelink.local or the IP)
  var h = location.hostname || 'firelink.local';
  document.getElementById('jellyfin').href = 'http://' + h + ':8096';
  document.getElementById('kavita').href   = 'http://' + h + ':5000';

  var quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- time of day ----------
  // preview mode: ?data=MM-DD and/or ?hora=H simulate a date or an hour (e.g. /?data=12-25&hora=21)
  var SIM = (function () {
    try { var q = new URLSearchParams(location.search), d = q.get('data'), h = q.get('hora');
      return { data: /^\d\d-\d\d$/.test(d || '') ? d : null, hora: /^\d{1,2}$/.test(h || '') && +h < 24 ? +h : null };
    } catch (e) { return {}; }
  })();
  var SIMULANDO = SIM.data !== null && SIM.data !== undefined || SIM.hora !== null && SIM.hora !== undefined;
  var HORA = SIM.hora != null ? SIM.hora : new Date().getHours();
  var PERIODO = HORA < 5 ? 'madrugada' : HORA < 12 ? 'manha' : HORA < 18 ? 'tarde' : 'noite';
  document.body.classList.add(PERIODO);
  if (PERIODO === 'noite' || PERIODO === 'madrugada') {
    var ceu = document.getElementById('ceu');
    for (var e = 0; e < 46; e++) {
      var st = document.createElement('i');
      st.style.left = (Math.random() * 100).toFixed(2) + '%'; st.style.top = (Math.random() * 55).toFixed(2) + '%';
      st.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      if (Math.random() < .2) { st.style.width = st.style.height = '2px'; }
      ceu.appendChild(st);
    }
  }

  // reload when the time of day or the date changes, but only if nobody is using the page
  (function () {
    var ultimaInteracao = Date.now(), dia = new Date().getDate();
    ['mousemove', 'touchstart', 'keydown', 'click'].forEach(function (ev) { addEventListener(ev, function () { ultimaInteracao = Date.now(); }, { passive: true }); });
    setInterval(function () {
      var h = new Date().getHours(), p = h < 5 ? 'madrugada' : h < 12 ? 'manha' : h < 18 ? 'tarde' : 'noite';
      if (!SIMULANDO && (p !== PERIODO || new Date().getDate() !== dia) && Date.now() - ultimaInteracao > 120000) location.reload();
    }, 60000);
  })();

  if (SIMULANDO) {
    var aviso = document.createElement('a');
    aviso.href = location.pathname; aviso.className = 'aviso-sim';
    aviso.textContent = 'SIMULAÇÃO: ' + (SIM.data ? SIM.data.slice(3) + '/' + SIM.data.slice(0, 2) : 'hoje') + (SIM.hora != null ? ' às ' + SIM.hora + 'h' : '') + '  ·  sair ✕';
    document.body.appendChild(aviso);
  }

  // ---------- special dates ----------
  // people, birthdays and Mother's Day come from config.js (kept out of Git; see config.example.js)
  var CFG = window.FIRELINK || {};
  var ANIVERSARIOS = CFG.birthdays || {};
  var HOJE = SIM.data || (function () { var d = new Date(); return ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })();
  var MES = +HOJE.slice(0, 2) - 1, DIA = +HOJE.slice(3);

      x.clearRect(0, 0, W, H);
      for (var i = 0; i < brasas.length; i++) {
        var b = brasas[i];
        b.y -= b.v; b.f += .03; b.x += Math.sin(b.f) * .4;
        var vida = b.y / H;                     // fades as it rises
        if (b.y < -P || Math.random() > .995 + vida * .005) { brasas[i] = nova(false); continue; }
        x.globalAlpha = Math.min(1, vida * 1.4);
        x.fillStyle = b.cor;
        var sx = Math.round(b.x / P) * P, sy = Math.round(b.y / P) * P;   // snap to the pixel grid
        x.fillRect(sx, sy, P * b.s, P * b.s);
      }
      x.globalAlpha = 1;
      requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);
  })();
</script>
</body>
